<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>MACC Product Capture</title>
<link rel="stylesheet" href="assets/ui.css">
</head>
<body class="popup">
<header>
  <img src="icons/icon32.png" alt="">
  <div><strong>MACC Field Kit</strong><span>capture products · fill contact forms</span></div>
  <button id="openOptions" class="icon-btn" title="Settings" type="button">⚙</button>
</header>
<nav class="tabs" role="tablist">
  <button id="tabCapture" class="tab is-on" type="button" role="tab">Capture</button>
  <button id="tabOutreach" class="tab" type="button" role="tab">Outreach</button>
</nav>
<section id="paneCapture">
<div id="srcline" class="srcline">Reading page…</div>
<div id="warn" class="warn" hidden></div>
<form id="form" autocomplete="off">
  <label class="full">Product<input id="product" placeholder="Product name"></label>
  <label>Brand name<input id="brand"></label>
  <label>Cost<input id="cost" placeholder="e.g. US $28.50–32.00 / pc"></label>
  <label>Currency<input id="currency" placeholder="USD / PHP / CNY"></label>
  <label>MOQ<input id="moq" placeholder="Min. order"></label>
  <label>Supplier / Seller<input id="supplier"></label>
  <label>Location<input id="location" placeholder="City, Country"></label>
  <label class="full">Description<textarea id="description" rows="3"></textarea></label>
  <label class="full">Other info<textarea id="other" rows="2" placeholder="Auto-collected extras (MOQ, ratings, group name…)"></textarea></label>
  <label class="full">Notes<textarea id="notes" rows="2" placeholder="Your notes — why it matters, next step…"></textarea></label>
  <label class="full">Page URL<input id="url" spellcheck="false"></label>
  <input type="hidden" id="image">
</form>
<div class="actions">
  <button id="save" class="primary" type="button">Save to Command Center</button>
  <button id="copy" type="button" title="Copy as a tab-separated row you can paste straight into a spreadsheet">Copy row</button>
  <button id="reextract" type="button" title="Clear the form and re-read the page">↻</button>
</div>
<div id="status" class="status"></div>
<a id="appLink" class="linklike" href="#" target="_blank" rel="noopener" hidden></a>
<div id="queueRow" class="queue" hidden>
  <span id="queueMsg"></span>
  <button id="retry" type="button">Retry queued</button>
</div>
<button id="openOptions2" class="linklike" type="button" hidden>Open settings</button>
</section>

<section id="paneOutreach" hidden>
  <div id="oSrcline" class="srcline">Reading this page…</div>
  <div id="oProfileWarn" class="warn" hidden></div>
  <div class="opad">
    <label class="stack">Message to use
      <select id="oTemplate"></select>
      <span class="hint" id="oHint"></span>
    </label>
    <label class="stack">Brand (used in the greeting)
      <input id="oBrand" placeholder="e.g. Sungrow" spellcheck="false">
    </label>
    <label class="stack">Draft — edit before you fill
      <textarea id="oMessage" rows="9" spellcheck="true"></textarea>
    </label>
    <label class="check"><input type="checkbox" id="oOverwrite"> Overwrite fields that already have a value</label>
  </div>
  <div class="actions">
    <button id="oFill" class="primary" type="button">Fill this form</button>
    <button id="oCopy" type="button" title="Copy the draft to the clipboard">Copy</button>
    <button id="oUndo" type="button" title="Put every field back the way it was">Undo</button>
  </div>
  <div id="oStatus" class="status"></div>
  <div id="oReport" class="report" hidden></div>
  <p class="footnote">Nothing is ever submitted for you — read what it wrote, tick any consent boxes, then send it yourself.</p>
</section>

<script src="templates.js"></script>
<script src="fill.js"></script>
<script src="popup.js"></script>
<script src="outreach.js"></script>
</body>
</html>
