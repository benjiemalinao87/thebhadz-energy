<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="og-t og-d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="og-t">On-grid system diagram</title>
  <desc id="og-d">Solar panels feed a grid-tie inverter, which powers the house and connects to the BILECO meter and distribution line. There is no battery, so the system shuts off when the grid goes down.</desc>

  <defs>
    <marker id="og-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1.2 8.6 5 0 8.8z" fill="#F2811D"/>
    </marker>
    <marker id="og-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1.2 8.6 5 0 8.8z" fill="#123A5E"/>
    </marker>
  </defs>

  <!-- solar panel array -->
  <text x="112" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#0A1E33" letter-spacing="1">SOLAR PANELS</text>
  <rect x="36" y="56" width="152" height="112" rx="6" fill="none" stroke="#0A1E33" stroke-width="3.5"/>
  <g fill="#0A1E33">
    <rect x="46" y="66" width="27" height="25" rx="2"/><rect x="81" y="66" width="27" height="25" rx="2"/>
    <rect x="116" y="66" width="27" height="25" rx="2"/><rect x="151" y="66" width="27" height="25" rx="2"/>
    <rect x="46" y="99" width="27" height="25" rx="2"/><rect x="81" y="99" width="27" height="25" rx="2"/>
    <rect x="116" y="99" width="27" height="25" rx="2"/><rect x="151" y="99" width="27" height="25" rx="2"/>
    <rect x="46" y="132" width="27" height="25" rx="2"/><rect x="81" y="132" width="27" height="25" rx="2"/>
    <rect x="116" y="132" width="27" height="25" rx="2"/><rect x="151" y="132" width="27" height="25" rx="2"/>
  </g>

  <!-- panels to inverter -->
  <path d="M188 112 H 236 V 196 H 274" fill="none" stroke="#F2811D" stroke-width="3.4" stroke-linecap="round" marker-end="url(#og-a)"/>

  <!-- inverter -->
  <rect x="280" y="158" width="160" height="88" rx="11" fill="#0A1E33"/>
  <circle cx="298" cy="176" r="4.4" fill="#F2811D"/><circle cx="313" cy="176" r="4.4" fill="#FFC24A"/>
  <text x="360" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">GRID-TIE</text>
  <text x="360" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#FFC24A">INVERTER</text>

  <!-- inverter to meter, meter to grid (bidirectional) -->
  <path d="M440 186 H 468 V 162 H 492" fill="none" stroke="#123A5E" stroke-width="3.4" stroke-linecap="round" marker-end="url(#og-n)" marker-start="url(#og-n)"/>
  <rect x="496" y="138" width="68" height="48" rx="7" fill="#F2811D"/>
  <text x="530" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">METER</text>
  <path d="M564 162 H 598" fill="none" stroke="#123A5E" stroke-width="3.4" stroke-linecap="round"/>

  <!-- distribution pole -->
  <g stroke="#123A5E" stroke-width="3.2" fill="none" stroke-linecap="round">
    <path d="M604 170 628 74 652 170"/>
    <path d="M628 74 V 170"/>
    <path d="M612 142 H 644 M617 122 H 639 M621 102 H 635"/>
    <path d="M602 88 H 654"/>
  </g>
  <text x="628" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#123A5E" letter-spacing=".6">DU / GRID</text>
  <text x="628" y="213" text-anchor="middle" font-size="12" fill="#4A5D70">BILECO line</text>

  <!-- inverter to house -->
  <path d="M440 220 H 540 V 300 H 590" fill="none" stroke="#F2811D" stroke-width="3.4" stroke-linecap="round" marker-end="url(#og-a)"/>

  <!-- house -->
  <path d="M596 292 644 254 692 292 V 348 H 596 Z" fill="none" stroke="#0A1E33" stroke-width="3.4" stroke-linejoin="round"/>
  <rect x="614" y="304" width="16" height="16" rx="2" fill="#F2811D"/>
  <rect x="658" y="304" width="16" height="16" rx="2" fill="#F2811D"/>
  <rect x="634" y="326" width="20" height="22" rx="2" fill="none" stroke="#0A1E33" stroke-width="2.6"/>
  <text x="644" y="368" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0A1E33">HOME LOAD</text>

  <!-- no battery -->
  <path d="M360 246 V 286" fill="none" stroke="#BFCEDB" stroke-width="2.6" stroke-dasharray="5 6" stroke-linecap="round"/>
  <rect x="286" y="288" width="148" height="48" rx="8" fill="none" stroke="#D96B0C" stroke-width="2.6" stroke-dasharray="7 6"/>
  <text x="360" y="312" text-anchor="middle" font-size="14.5" font-weight="700" fill="#D96B0C">NO BATTERY</text>
  <text x="360" y="328" text-anchor="middle" font-size="11.5" fill="#8A6A1E">nothing to run on</text>

  <!-- legend -->
  <g font-size="12.5" fill="#4A5D70">
    <path d="M40 396 H 66" stroke="#F2811D" stroke-width="3.2" stroke-linecap="round" marker-end="url(#og-a)"/>
    <text x="76" y="400">Solar power</text>
    <path d="M186 396 H 212" stroke="#123A5E" stroke-width="3.2" stroke-linecap="round"/>
    <text x="222" y="400">Grid connection</text>
  </g>
</svg>
