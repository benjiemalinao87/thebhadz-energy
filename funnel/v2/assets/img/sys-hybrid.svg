<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="hy-t hy-d" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title id="hy-t">Hybrid system diagram</title>
  <desc id="hy-d">Solar panels feed a hybrid inverter that charges a battery, powers the house, and stays connected to the BILECO meter and distribution line. When the grid drops, the battery takes over the backed-up circuits automatically.</desc>

  <defs>
    <marker id="hy-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1.2 8.6 5 0 8.8z" fill="#F2811D"/>
    </marker>
    <marker id="hy-n" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M0 1.2 8.6 5 0 8.8z" fill="#123A5E"/>
    </marker>
  </defs>

  <!-- solar panel array -->
  <text x="112" y="42" text-anchor="middle" font-size="15" font-weight="700" fill="#0A1E33" letter-spacing="1">SOLAR PANELS</text>
  <rect x="36" y="56" width="152" height="112" rx="6" fill="none" stroke="#0A1E33" stroke-width="3.5"/>
  <g fill="#0A1E33">
    <rect x="46" y="66" width="27" height="25" rx="2"/><rect x="81" y="66" width="27" height="25" rx="2"/>
    <rect x="116" y="66" width="27" height="25" rx="2"/><rect x="151" y="66" width="27" height="25" rx="2"/>
    <rect x="46" y="99" width="27" height="25" rx="2"/><rect x="81" y="99" width="27" height="25" rx="2"/>
    <rect x="116" y="99" width="27" height="25" rx="2"/><rect x="151" y="99" width="27" height="25" rx="2"/>
    <rect x="46" y="132" width="27" height="25" rx="2"/><rect x="81" y="132" width="27" height="25" rx="2"/>
    <rect x="116" y="132" width="27" height="25" rx="2"/><rect x="151" y="132" width="27" height="25" rx="2"/>
  </g>

  <!-- panels to inverter -->
  <path d="M188 112 H 236 V 196 H 274" fill="none" stroke="#F2811D" stroke-width="3.4" stroke-linecap="round" marker-end="url(#hy-a)"/>

  <!-- inverter -->
  <rect x="280" y="158" width="160" height="88" rx="11" fill="#0A1E33"/>
  <circle cx="298" cy="176" r="4.4" fill="#F2811D"/><circle cx="313" cy="176" r="4.4" fill="#FFC24A"/>
  <text x="360" y="205" text-anchor="middle" font-size="16" font-weight="700" fill="#FFFFFF">HYBRID</text>
  <text x="360" y="226" text-anchor="middle" font-size="16" font-weight="700" fill="#FFC24A">INVERTER</text>

  <!-- inverter to meter, meter to grid -->
  <path d="M440 186 H 468 V 162 H 492" fill="none" stroke="#123A5E" stroke-width="3.4" stroke-linecap="round" marker-end="url(#hy-n)" marker-start="url(#hy-n)"/>
  <rect x="496" y="138" width="68" height="48" rx="7" fill="#F2811D"/>
  <text x="530" y="168" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">METER</text>
  <path d="M564 162 H 598" fill="none" stroke="#123A5E" stroke-width="3.4" stroke-linecap="round"/>

  <!-- distribution pole -->
  <g stroke="#123A5E" stroke-width="3.2" fill="none" stroke-linecap="round">
    <path d="M604 170 628 74 652 170"/>
    <path d="M628 74 V 170"/>
    <path d="M612 142 H 644 M617 122 H 639 M621 102 H 635"/>
    <path d="M602 88 H 654"/>
  </g>
  <text x="628" y="196" text-anchor="middle" font-size="13.5" font-weight="700" fill="#123A5E" letter-spacing=".6">DU / GRID</text>
  <text x="628" y="213" text-anchor="middle" font-size="12" fill="#4A5D70">stays as fallback</text>

  <!-- inverter to house -->
  <path d="M440 220 H 540 V 300 H 590" fill="none" stroke="#F2811D" stroke-width="3.4" stroke-linecap="round" marker-end="url(#hy-a)"/>

  <!-- house -->
  <path d="M596 292 644 254 692 292 V 348 H 596 Z" fill="none" stroke="#0A1E33" stroke-width="3.4" stroke-linejoin="round"/>
  <rect x="614" y="304" width="16" height="16" rx="2" fill="#F2811D"/>
  <rect x="658" y="304" width="16" height="16" rx="2" fill="#F2811D"/>
  <rect x="634" y="326" width="20" height="22" rx="2" fill="none" stroke="#0A1E33" stroke-width="2.6"/>
  <text x="644" y="368" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0A1E33">HOME LOAD</text>

  <!-- battery, charges and discharges -->
  <path d="M360 246 V 292" fill="none" stroke="#F2811D" stroke-width="3.4" stroke-linecap="round" marker-end="url(#hy-a)" marker-start="url(#hy-a)"/>
  <rect x="300" y="296" width="120" height="52" rx="7" fill="#FFC24A" stroke="#D96B0C" stroke-width="2.6"/>
  <rect x="322" y="290" width="14" height="7" rx="2" fill="#D96B0C"/>
  <rect x="384" y="290" width="14" height="7" rx="2" fill="#D96B0C"/>
  <text x="330" y="330" text-anchor="middle" font-size="21" font-weight="700" fill="#0A1E33">+</text>
  <text x="390" y="330" text-anchor="middle" font-size="21" font-weight="700" fill="#0A1E33">–</text>
  <text x="360" y="368" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0A1E33">BATTERY</text>

  <!-- backed-up circuits -->
  <path d="M300 322 H 226" fill="none" stroke="#F2811D" stroke-width="3.4" stroke-linecap="round" marker-end="url(#hy-a)"/>
  <circle cx="176" cy="308" r="34" fill="#F2811D"/>
  <path d="M162 296 q6 -12 18 -8" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
  <rect x="164" y="343" width="24" height="6" rx="2" fill="#0A1E33"/>
  <rect x="167" y="352" width="18" height="6" rx="2" fill="#0A1E33"/>
  <text x="176" y="378" text-anchor="middle" font-size="13.5" font-weight="700" fill="#0A1E33">BACKED-UP</text>
  <text x="176" y="394" text-anchor="middle" font-size="12" fill="#4A5D70">lights, fans, WiFi</text>

  <!-- legend -->
  <g font-size="12.5" fill="#4A5D70">
    <path d="M470 396 H 496" stroke="#F2811D" stroke-width="3.2" stroke-linecap="round" marker-end="url(#hy-a)"/>
    <text x="506" y="400">Solar power</text>
    <path d="M596 396 H 622" stroke="#123A5E" stroke-width="3.2" stroke-linecap="round"/>
    <text x="632" y="400">Grid</text>
  </g>
</svg>
