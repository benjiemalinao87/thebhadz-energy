<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Command Center — MACC Systems &amp; Engineering Inc.</title>
<script src="/internal/assets/theme.js"></script>
<script src="/internal/assets/section-visibility.js"></script>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="/assets/img/macc-mark.png">
<style>
  /* ============================================================
     MACC Founder Command Center — dashboard
     Self-contained "monitor / terminal" theme, modeled on the
     customer-command-center design system. Everything is namespaced
     under .cc- so it can't collide with the shared internal styles
     used by the SC doc pages.
     ============================================================ */

  .cc-root {
    --mono: ui-monospace, "SF Mono", SFMono-Regular, "IBM Plex Mono", Menlo, Monaco, Consolas, monospace;
    --display: "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;

    --bg: #020202;
    --panel-a: rgba(12, 12, 12, 0.96);
    --panel-b: rgba(5, 5, 5, 0.98);

    --z-900: #18181b; --z-800: #27272a; --z-700: #3f3f46; --z-600: #52525b;
    --z-500: #71717a; --z-400: #a1a1aa; --z-300: #d4d4d8; --z-200: #e4e4e7;
    --z-100: #f4f4f5; --z-50: #fafafa;

    --cyan: #45c0d6; --green: #2fd5bf; --yellow: #ff8f73; --red: #ff7b81;
    --purple: #9aa4e6; --blue: #7aa7d9; --amber: #ff7a59;

    --cyan-bd: rgba(69,192,214,0.25); --green-bd: rgba(47,213,191,0.22);
    --yellow-bd: rgba(255,143,115,0.24); --red-bd: rgba(255,123,129,0.28);
    --purple-bd: rgba(154,164,230,0.24); --blue-bd: rgba(122,167,217,0.22);

    --sidebar-w: 248px;
  }

  html { scroll-behavior: smooth; }

  body.cc-body {
    margin: 0;
    background:
      radial-gradient(1200px 600px at 30% -10%, rgba(56,189,248,0.05), transparent 55%),
      radial-gradient(1000px 500px at 100% -5%, rgba(255,143,115,0.035), transparent 50%),
      var(--bg);
    color: var(--z-100);
    font-family: var(--mono);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
  }

  .cc-root * { box-sizing: border-box; }
  .cc-root a { color: inherit; text-decoration: none; }
  .cc-root ::selection { background: rgba(69,192,214,0.25); color: #fff; }

  /* scanline overlay */
  .cc-body::before {
    content: ""; position: fixed; inset: 0; z-index: 90; pointer-events: none;
    opacity: 0.09;
    background-image: linear-gradient(to bottom, rgba(255,255,255,0.10) 1px, transparent 1px);
    background-size: 100% 4px;
  }

  .cc-layout { display: flex; min-height: 100vh; }

  /* ---------- SIDEBAR ---------- */
  .cc-sidebar {
    width: var(--sidebar-w); flex-shrink: 0;
    position: sticky; top: 0; align-self: flex-start; height: 100vh;
    display: flex; flex-direction: column;
    background: linear-gradient(180deg, rgba(10,10,11,0.96), rgba(3,3,3,0.98));
    border-right: 1px solid var(--z-800); z-index: 60;
  }
  .cc-sidebar::after {
    content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 1px;
    background: linear-gradient(180deg, transparent, rgba(69,192,214,0.25), transparent);
    pointer-events: none;
  }
  .cc-sb-head {
    display: flex; align-items: center; gap: 11px; padding: 18px;
    border-bottom: 1px dashed rgba(63,63,70,0.9);
  }
  .cc-sb-mark {
    width: 34px; height: 34px; flex: none; display: grid; place-items: center;
    border-radius: 10px; background: rgba(245,158,11,0.12);
    border: 1px solid rgba(245,158,11,0.3); color: var(--amber);
  }
  .cc-sb-title { display: flex; flex-direction: column; line-height: 1.15; }
  .cc-sb-title .brand { font-family: var(--display); font-size: 14px; font-weight: 600; color: var(--z-50); letter-spacing: 0.02em; }
  .cc-sb-title .sub { font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.24em; color: var(--z-500); margin-top: 2px; }

  .cc-sb-user {
    margin: 12px 12px 4px; display: flex; align-items: center; gap: 8px;
    padding: 8px 11px; border-radius: 10px; background: rgba(9,9,11,0.7); border: 1px solid var(--z-800);
  }
  .cc-sb-user svg { color: var(--cyan); flex: none; }
  .cc-sb-user span { font-size: 11px; color: var(--z-300); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a.cc-sb-user { text-decoration: none; }
  a.cc-sb-user:hover { border-color: var(--cyan-bd); }
  a.cc-sb-user:hover span { color: var(--z-100); }

  .cc-sb-nav { flex: 1; overflow-y: auto; padding: 10px 12px 4px; scrollbar-width: thin; scrollbar-color: rgba(113,113,122,0.6) transparent; }
  .cc-sb-nav::-webkit-scrollbar { width: 8px; }
  .cc-sb-nav::-webkit-scrollbar-thumb { background: rgba(113,113,122,0.5); border-radius: 999px; border: 2px solid transparent; background-clip: padding-box; }

  .cc-sb-group { margin-bottom: 12px; }
  .cc-sb-group-label { padding: 0 10px; margin-bottom: 6px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.22em; color: var(--z-600); }

  .cc-sb-item {
    position: relative; width: 100%; display: flex; align-items: center; gap: 11px;
    padding: 8px 10px; border-radius: 9px; font-size: 12.5px; font-weight: 500;
    color: var(--z-400); background: transparent; border: 1px solid transparent;
    cursor: pointer; transition: background 0.14s, color 0.14s, border-color 0.14s; text-align: left;
  }
  .cc-sb-item svg { width: 17px; height: 17px; flex: none; opacity: 0.85; }
  .cc-sb-item:hover { background: rgba(255,255,255,0.03); color: var(--z-100); }
  .cc-sb-item.active { background: rgba(69,192,214,0.08); border-color: var(--cyan-bd); color: var(--cyan); }
  .cc-sb-item.active::before { content: ""; position: absolute; left: -12px; top: 50%; transform: translateY(-50%); width: 3px; height: 18px; border-radius: 0 3px 3px 0; background: var(--cyan); }
  .cc-sb-item .tail { margin-left: auto; font-size: 9px; letter-spacing: 0.12em; color: var(--z-500); font-variant-numeric: tabular-nums; }
  .cc-sb-item .dot-badge { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--yellow); box-shadow: 0 0 8px rgba(255,143,115,0.6); }

  .cc-sb-foot { padding: 12px; border-top: 1px dashed rgba(63,63,70,0.9); display: flex; flex-direction: column; gap: 6px; }
  .cc-sb-btn {
    display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: 9px;
    font-size: 12px; font-weight: 500; color: var(--z-300); background: transparent;
    border: 1px solid transparent; cursor: pointer; width: 100%; text-align: left;
    transition: background 0.14s, color 0.14s; font-family: var(--mono);
  }
  .cc-sb-btn svg { width: 17px; height: 17px; flex: none; }
  .cc-sb-btn:hover { background: rgba(255,255,255,0.03); color: var(--z-50); }
  .cc-sb-btn.danger { color: var(--red); }
  .cc-sb-btn.danger:hover { background: rgba(255,123,129,0.08); }

  /* ---------- MAIN ---------- */
  /* .cc-main is a pure flex/layout container now — the SPA router swaps its content
     wholesale (a fetched page's own <main class="content|ops-content"> element, or this
     dashboard's own .cc-main-inner), so padding/max-width live on THAT inner element
     instead of here. Otherwise every non-dashboard view would double up on padding. */
  .cc-main { flex: 1; min-width: 0; }
  .cc-main-inner { padding: clamp(18px, 3vw, 36px); max-width: 1200px; }
  .cc-main section[id] { scroll-margin-top: 20px; }

  .cc-masthead {
    display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between;
    gap: 20px; padding-bottom: 22px; border-bottom: 1px dashed rgba(63,63,70,0.9);
  }
  .cc-eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: 0.32em; color: var(--z-500); display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .cc-eyebrow .brand { color: var(--amber); font-weight: 600; }
  .cc-eyebrow .dot { color: var(--z-700); }
  .cc-main h1 { font-family: var(--display); font-size: clamp(1.8rem, 3.6vw, 2.6rem); font-weight: 600; letter-spacing: 0.01em; line-height: 1.05; margin: 14px 0 0; color: var(--z-50); text-wrap: balance; }
  .cc-lede { margin: 14px 0 0; max-width: 62ch; font-size: 13.5px; color: var(--z-400); line-height: 1.65; }
  .cc-lede a { color: var(--amber); border-bottom: 1px dashed rgba(245,158,11,0.5); }
  .cc-lede a:hover { color: #fbbf24; }

  .cc-head-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 12px; }
  .cc-badge { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 8px 14px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.28em; border: 1px solid rgba(47,213,191,0.35); background: rgba(47,213,191,0.10); color: #b8ece4; }
  .cc-badge .pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: cc-pulse 2s infinite; }
  @keyframes cc-pulse { 0% { box-shadow: 0 0 0 0 rgba(47,213,191,0.5); } 70% { box-shadow: 0 0 0 6px rgba(47,213,191,0); } 100% { box-shadow: 0 0 0 0 rgba(47,213,191,0); } }
  .cc-updated { font-size: 10px; text-transform: uppercase; letter-spacing: 0.24em; color: var(--z-500); display: flex; align-items: center; gap: 6px; }

  /* ---------- panel base ---------- */
  .cc-panel {
    position: relative; overflow: hidden; border-radius: 18px; border: 1px solid var(--z-800);
    background: linear-gradient(180deg, var(--panel-a), var(--panel-b)), #000;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 18px 38px rgba(0,0,0,0.30);
  }
  .cc-panel::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.16), transparent); opacity: 0.5; pointer-events: none; }
  .cc-panel::after { content: ""; position: absolute; inset: 1px; border: 1px solid rgba(255,255,255,0.03); border-radius: inherit; pointer-events: none; }
  .cc-panel > * { position: relative; z-index: 1; }
  .cc-panel[data-tone="cyan"]   { border-color: var(--cyan-bd);   box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 18px 38px rgba(8,145,178,0.16); }
  .cc-panel[data-tone="green"]  { border-color: var(--green-bd);  box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 18px 38px rgba(34,197,94,0.14); }
  .cc-panel[data-tone="yellow"] { border-color: var(--yellow-bd); box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 18px 38px rgba(202,138,4,0.14); }
  .cc-panel[data-tone="purple"] { border-color: var(--purple-bd); box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 18px 38px rgba(147,51,234,0.14); }
  .cc-panel[data-tone="blue"]   { border-color: var(--blue-bd);   box-shadow: inset 0 1px 0 rgba(255,255,255,0.03), 0 18px 38px rgba(37,99,235,0.14); }

  /* ---------- stat strip ---------- */
  .cc-strip { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 26px; }
  .cc-stat { padding: 16px; display: flex; flex-direction: column; gap: 4px; }
  .cc-stat .label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.28em; }
  .cc-stat .value { font-family: var(--display); font-size: 1.9rem; font-weight: 600; letter-spacing: -0.01em; color: var(--z-50); font-variant-numeric: tabular-nums; }
  .cc-stat .sub { font-size: 11px; color: var(--z-500); }
  .cc-stat .value.tone-green  { color: var(--green); }
  .cc-stat .value.tone-cyan   { color: var(--cyan); }
  .cc-stat .value.tone-yellow { color: var(--yellow); }
  .cc-stat .value.tone-purple { color: var(--purple); }

  .cc-section-head { display: flex; align-items: center; gap: 14px; margin: 40px 0 16px; }
  .cc-section-head .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3em; color: var(--z-400); white-space: nowrap; }
  .cc-section-head .rule { flex: 1; height: 1px; background: repeating-linear-gradient(90deg, var(--z-800) 0 6px, transparent 6px 12px); }
  .cc-section-head .count { font-size: 11px; color: var(--z-600); letter-spacing: 0.1em; }

  /* ---------- console cards ---------- */
  .cc-consoles { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; }
  .cc-console { padding: 22px; display: block; transition: transform 0.18s; }
  .cc-console.wide { grid-column: 1 / -1; }
  .cc-console:hover { transform: translateY(-2px); }
  .cc-console:hover .arrow { transform: translateX(4px); }
  .cc-console .kicker { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.28em; margin-bottom: 14px; }
  .cc-console .row { display: flex; align-items: center; gap: 14px; }
  .cc-console .ico { width: 42px; height: 42px; flex: none; display: grid; place-items: center; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); }
  .cc-console h2 { font-family: var(--display); font-size: 1.35rem; font-weight: 600; margin: 0; color: var(--z-50); display: flex; align-items: center; gap: 10px; }
  .cc-console .arrow { transition: transform 0.18s; display: inline-block; }
  .cc-console p { margin: 12px 0 0; font-size: 13px; color: var(--z-400); line-height: 1.6; }
  .cc-console .meta { margin-top: 16px; padding-top: 14px; border-top: 1px dashed rgba(63,63,70,0.7); display: flex; gap: 20px; flex-wrap: wrap; font-size: 11px; color: var(--z-500); font-variant-numeric: tabular-nums; }
  .cc-console .meta b { color: var(--z-200); font-weight: 600; }
  .cc-ico.cyan   { background: rgba(69,192,214,0.10); color: var(--cyan); }
  .cc-ico.purple { background: rgba(154,164,230,0.10); color: var(--purple); }
  .cc-ico.amber  { background: rgba(245,158,11,0.10);  color: var(--amber); }

  /* ---------- two-model ---------- */
  .cc-models { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .cc-model { padding: 18px 20px; }
  .cc-model .mk { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.28em; margin-bottom: 8px; }
  .cc-model h4 { font-family: var(--display); font-size: 1.05rem; margin: 0 0 6px; color: var(--z-50); font-weight: 600; }
  .cc-model p { margin: 0; font-size: 12px; color: var(--z-400); line-height: 1.55; }
  .cc-model .mk.a { color: var(--cyan); }
  .cc-model .mk.b { color: var(--green); }

  /* ---------- doc grid ---------- */
  .cc-docs { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .cc-doc { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; transition: transform 0.16s; }
  .cc-doc:hover { transform: translateY(-2px); }
  .cc-doc:hover .doc-arrow { opacity: 1; transform: translateX(3px); }
  .cc-doc-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .cc-doc .code { font-size: 10.5px; font-weight: 600; letter-spacing: 0.24em; }
  .cc-doc .status { font-size: 9px; text-transform: uppercase; letter-spacing: 0.18em; padding: 3px 8px; border-radius: 999px; border: 1px solid transparent; }
  .cc-status.ready  { color: var(--green);  border-color: var(--green-bd);  background: rgba(47,213,191,0.08); }
  .cc-status.review { color: var(--yellow); border-color: var(--yellow-bd); background: rgba(255,143,115,0.08); }
  .cc-status.wip    { color: var(--blue);   border-color: var(--blue-bd);   background: rgba(122,167,217,0.08); }
  .cc-doc h3 { font-family: var(--display); font-size: 1.15rem; font-weight: 600; margin: 0; color: var(--z-50); display: flex; align-items: center; gap: 8px; }
  .cc-doc-arrow { opacity: 0.4; transition: opacity 0.16s, transform 0.16s; color: var(--z-400); }
  .cc-doc p { margin: 0; font-size: 12.5px; color: var(--z-400); line-height: 1.55; }
  .cc-doc .foot { margin-top: 2px; font-size: 10.5px; color: var(--z-600); letter-spacing: 0.06em; text-transform: uppercase; }

  .cc-foot-strip { margin-top: 40px; padding-top: 20px; border-top: 1px dashed rgba(63,63,70,0.9); display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; font-size: 11px; color: var(--z-600); letter-spacing: 0.08em; }
  .cc-foot-strip .k { color: var(--z-500); }

  /* ---------- mobile ---------- */
  .cc-menu-toggle { display: none; position: fixed; top: 14px; left: 14px; z-index: 80; width: 42px; height: 42px; border-radius: 11px; background: rgba(10,10,11,0.9); border: 1px solid var(--z-700); color: var(--z-100); cursor: pointer; place-items: center; }
  .cc-scrim { display: none; }

  @media (max-width: 980px) {
    .cc-menu-toggle { display: grid; }
    .cc-sidebar { position: fixed; top: 0; left: 0; height: 100vh; transform: translateX(-100%); transition: transform 0.25s ease; }
    .cc-body.nav-open .cc-sidebar { transform: translateX(0); }
    .cc-body.nav-open .cc-scrim { display: block; position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,0.6); backdrop-filter: blur(2px); }
    .cc-main { padding-top: 68px; }
    .cc-main-inner { max-width: 100%; }
    .cc-main > .content, .cc-main > .ops-content { max-width: 100%; }
    .cc-strip { grid-template-columns: repeat(2, 1fr); }
    .cc-consoles, .cc-docs, .cc-models { grid-template-columns: 1fr; }
    .cc-head-actions { align-items: flex-start; }
  }
  @media (max-width: 460px) { .cc-strip { grid-template-columns: 1fr 1fr; } }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } .cc-root * { transition: none !important; animation: none !important; } }
  .cc-root :focus-visible { outline: 2px solid var(--cyan); outline-offset: 3px; border-radius: 6px; }
</style>

<!-- cc-shell (the light dashboard ground) is applied here for the initial load and
     then toggled per route by assets/spa-router.js, which removes it when another
     view takes over. -->
<body class="cc-body cc-root cc-shell">

<a class="cc-skip-link" href="#cc-main">Skip to main content</a>
<button class="cc-menu-toggle" id="cc-menu-toggle" type="button" aria-label="Open navigation" aria-controls="cc-sidebar" aria-expanded="false">
  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
</button>

<div class="cc-layout">
  <button class="cc-scrim" type="button" aria-label="Close navigation" tabindex="-1"></button>

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="cc-sidebar" id="cc-sidebar">
    <div class="cc-sb-head">
      <div class="cc-sb-mark" aria-hidden="true">
        <img src="/assets/img/macc-mark.png" alt="" width="22" height="22">
      </div>
      <div class="cc-sb-title">
        <span class="brand">MACC</span>
        <span class="sub">Command center</span>
      </div>
      <button class="cc-sb-pin" id="cc-sb-pin" type="button" aria-pressed="false" title="Pin open" aria-label="Pin sidebar open">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
      </button>
    </div>

    <!-- Filled in with the signed-in founder by the /api/session call at the end of
         this file; the static text is the fallback if that request fails. -->
    <a class="cc-sb-user" id="cc-who" href="/internal/team.html" title="Your login and the team's activity">
      <span class="cc-sb-avatar" id="cc-sb-avatar" aria-hidden="true">·</span>
      <span id="cc-who-label">Founder access · confidential</span>
    </a>

    <!-- One entry. Navigation moved to /internal/apps.html so this rail stops competing
         with the dashboard for attention; the Apps grid is also where per-account
         visibility is applied, and it can show what each tool's live state is. -->
    <nav class="cc-sb-nav" aria-label="Primary">
      <div class="cc-sb-group cc-sb-primary">
        <a class="cc-sb-item" href="/internal/apps.html" title="All tools">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          Apps
        </a>
      </div>
    </nav>

    <div class="cc-sb-foot">
      <button class="cc-sb-btn sc-theme-toggle" type="button" data-theme-toggle aria-pressed="false">
        <span data-theme-icon aria-hidden="true">◐</span>
        <span data-theme-label>Dark mode</span>
      </button>
      <a class="cc-sb-btn danger" href="/api/founder-logout">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log out
      </a>
    </div>
  </aside>

  <!-- ===================== WORKSPACE ===================== -->
  <div class="cc-workspace">

  <!-- #cc-view is the SPA router's swap target (assets/spa-router.js). Its first child is
       either .cc-main-inner (this dashboard, the "home" view) or a fetched internal page's
       own <main class="content"|"ops-content"> element, injected wholesale. -->
  <div class="cc-main" id="cc-view" aria-busy="false">
   <main class="cc-main-inner" id="cc-main" tabindex="-1">
    <span id="top"></span>

    <!-- The dashboard is assembled by assets/dashboard.js from the live APIs. It mounts
         here rather than being written into this file, so the shell holds no numbers of
         its own that could drift from the database. -->
    <div class="db" id="db-root">
      <p class="db-skel">Loading the week…</p>
    </div>

   </main>
  </div>
  </div><!-- /.cc-workspace -->
</div>

<div class="cc-route-status" id="cc-route-status" role="status" aria-live="polite" aria-atomic="true"></div>

<script>
  // Accessible mobile navigation shared by every SPA view.
  (function () {
    var toggle = document.getElementById('cc-menu-toggle');
    var scrim = document.querySelector('.cc-scrim');
    var sidebar = document.getElementById('cc-sidebar');
    if (!toggle || !scrim || !sidebar) return;

    function setOpen(open) {
      document.body.classList.toggle('nav-open', open);
      toggle.setAttribute('aria-expanded', String(open));
      toggle.setAttribute('aria-label', open ? 'Close navigation' : 'Open navigation');
      scrim.tabIndex = open ? 0 : -1;
      if (open) {
        var first = sidebar.querySelector('a, button');
        if (first) first.focus();
      } else {
        toggle.focus();
      }
    }

    toggle.addEventListener('click', function () {
      setOpen(!document.body.classList.contains('nav-open'));
    });
    scrim.addEventListener('click', function () { setOpen(false); });
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && document.body.classList.contains('nav-open')) setOpen(false);
    });
    window.ccCloseNavigation = function () {
      document.body.classList.remove('nav-open');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Open navigation');
      scrim.tabIndex = -1;
    };
  })();

  // Active-state sync for in-page anchors + mobile drawer close.
  (function () {
    var items = Array.prototype.slice.call(document.querySelectorAll('.cc-sb-item[href^="#"]'));
    var byHash = {};
    items.forEach(function (el) { byHash[el.getAttribute('href')] = el; });

    function setActive(hash) {
      items.forEach(function (el) { el.classList.remove('active'); });
      if (byHash[hash]) byHash[hash].classList.add('active');
    }

    items.forEach(function (el) {
      el.addEventListener('click', function () {
        setActive(el.getAttribute('href'));
        document.body.classList.remove('nav-open');
      });
    });

    var targets = items
      .map(function (el) { return document.querySelector(el.getAttribute('href')); })
      .filter(Boolean);

    if ('IntersectionObserver' in window && targets.length) {
      var spy = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) setActive('#' + entry.target.id);
        });
      }, { rootMargin: '-15% 0px -70% 0px', threshold: 0 });
      targets.forEach(function (t) { spy.observe(t); });
    }
  })();

  // The dashboard's numbers are assembled by assets/dashboard.js, which also defines
  // window.ccRefreshDashboardMetrics — the hook spa-router.js calls on every swap back to
  // the home view. Nothing in this file holds a count of its own any more, so there is no
  // second copy to drift from the database.

  // Name the founder who is signed in. The sidebar itself no longer lists sections, so
  // there is nothing here left to filter — /internal/apps.html applies per-account
  // visibility to its own tiles, and both middlewares still refuse hidden pages and APIs
  // server-side, so a typed URL 403s either way.
  (function showSignedInFounder() {
    var label = document.getElementById('cc-who-label');
    if (!label || !window.scSectionVisibility) return;
    window.scSectionVisibility.session().then(function (data) {
      if (!data || !data.user) return;   // signed out — the /internal gate handles it

      label.textContent = data.user.name + (data.user.role === 'master' ? ' · founder' : ' · limited access');
      if (data.user.must_change) {
        label.textContent = data.user.name + ' · set your password';
        var who = document.getElementById('cc-who');
        if (who) who.classList.add('cc-sb-user-alert');
      }

      var avatar = document.getElementById('cc-sb-avatar');
      if (avatar && data.user.name) {
        // The shared team login's name is a label, not a person, so initialling it the
        // usual way produced nonsense. Mark it as the team instead.
        if (data.shared) {
          avatar.textContent = 'TL';
          avatar.title = 'Shared team login';
        } else {
          var parts = data.user.name.trim().split(/\s+/);
          avatar.textContent = ((parts[0] || '?')[0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
        }
      }
    });
  })();
</script>
<script src="/internal/assets/dashboard.js"></script>
<script src="/internal/assets/sidebar-collapse.js"></script>
<script src="/internal/assets/spa-router.js"></script>
