<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goals — MACC Systems &amp; Engineering Inc.</title>
<script>
  (function () {
    if (document.getElementById("cc-view")) return;
    var m = /^\/internal\/([a-z0-9-]+)(?:\.html)?$/i.exec(location.pathname);
    if (m && m[1].toLowerCase() !== "index") location.replace("/internal/?open=" + m[1].toLowerCase());
  })();
</script>
<script src="/internal/assets/theme.js"></script>
<link rel="icon" href="/assets/img/macc-mark.png">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/internal/assets/operations-redesign.css">
<link rel="stylesheet" href="/internal/assets/goals.css">
</head>
<body class="ops-standalone ops-goals">

  <main class="wrap gl-wrap">
    <div class="gl-kpis" id="gl-kpis"></div>

    <div class="gl-toolbar">
      <div class="gl-views" role="tablist" aria-label="Goals views">
        <button type="button" role="tab" data-view="board" aria-selected="true">Board</button>
        <button type="button" role="tab" data-view="timeline" aria-selected="false">Timeline</button>
      </div>
      <button type="button" class="gl-btn primary" id="gl-new">New goal</button>
    </div>

    <div id="gl-app" aria-live="polite"></div>

    <dialog class="gl-dialog" id="gl-dialog" aria-labelledby="gl-dialog-title">
      <form method="dialog" id="gl-form">
        <div class="gl-dialog-head">
          <div>
            <span class="gl-kicker">COUNTABLE OUTCOME</span>
            <h2 id="gl-dialog-title">New goal</h2>
          </div>
          <button type="button" class="gl-btn ghost" id="gl-dialog-close">Close</button>
        </div>
        <input type="hidden" name="id" value="">
        <label>Goal title
          <input name="title" maxlength="120" required placeholder="Generate 2 leads this week">
        </label>
        <div class="gl-grid2">
          <label>What to count
            <select name="metric">
              <option value="leads">New leads</option>
              <option value="sold">Closed / sold leads</option>
              <option value="deposits">Deposits banked</option>
              <option value="surveys">Surveys done</option>
              <option value="manual">Manual count</option>
            </select>
          </label>
          <label>Target number
            <input name="target" type="number" min="1" step="1" value="2" required>
          </label>
        </div>
        <div class="gl-grid2">
          <label>Start
            <input name="start_date" type="date" required>
          </label>
          <label>End
            <input name="end_date" type="date" required>
          </label>
        </div>
        <div class="gl-grid2">
          <label>Status
            <select name="status">
              <option value="Backlog">Backlog</option>
              <option value="This week">This week</option>
              <option value="Doing">Doing</option>
              <option value="Done">Done</option>
              <option value="Missed">Missed</option>
            </select>
          </label>
          <label>Assigned to
            <select name="assignee_user_id">
              <option value="">— unassigned —</option>
            </select>
          </label>
        </div>
        <label class="gl-manual" hidden>Current count (manual only)
          <input name="current_manual" type="number" min="0" step="1" value="0">
        </label>
        <label>Notes
          <textarea name="notes" rows="2" maxlength="400" placeholder="Optional — what has to be true to hit this"></textarea>
        </label>
        <div class="gl-dialog-actions">
          <button type="button" class="gl-btn danger" id="gl-delete" hidden>Delete</button>
          <span class="gl-spacer"></span>
          <button type="submit" class="gl-btn primary" id="gl-save">Save goal</button>
        </div>
      </form>
    </dialog>

    <div class="gl-toasts" id="gl-toasts" aria-live="polite"></div>
  </main>

  <script src="/internal/assets/goals.js"></script>
</body>
</html>
