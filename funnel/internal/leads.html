<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacts — MACC Systems &amp; Engineering Inc.</title>
<script>
  // The Command Center shell is the UI for this page. A standalone load — refresh,
  // bookmark, pasted link — hits this real file with no shell around it, so bounce to
  // the dashboard, which reopens the page inside the SPA via ?open= (spa-router.js).
  // The slug comes from the path, so this block is identical on every page. Inside the
  // shell it re-runs after a swap, finds #cc-view, and does nothing.
  (function () {
    if (document.getElementById("cc-view")) return;
    var m = /^\/internal\/([a-z0-9-]+)(?:\.html)?$/i.exec(location.pathname);
    if (m && m[1].toLowerCase() !== "index") location.replace("/internal/?open=" + m[1].toLowerCase());
  })();
</script>
<script src="/internal/assets/theme.js"></script>

<meta name="robots" content="noindex, nofollow">
<style>
  /* ============================================================
     MACC CRM — Contacts table
     Command-center "monitor" theme (matches /internal dashboard).
     Backed by /api/leads (GET list, PATCH stage/notes, DELETE).
     ============================================================ */
  :root{
    --mono:ui-monospace,"SF Mono",SFMono-Regular,"IBM Plex Mono",Menlo,Monaco,Consolas,monospace;
    --display:"SF Pro Display",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    --bg:#020202; --panel-a:rgba(12,12,12,0.96); --panel-b:rgba(5,5,5,0.98);
    --z-900:#18181b; --z-800:#27272a; --z-700:#3f3f46; --z-600:#52525b;
    --z-500:#71717a; --z-400:#a1a1aa; --z-300:#d4d4d8; --z-200:#e4e4e7; --z-100:#f4f4f5; --z-50:#fafafa;
    --cyan:#45c0d6; --green:#2fd5bf; --yellow:#ff8f73; --red:#ff7b81; --purple:#9aa4e6; --blue:#7aa7d9; --amber:#ff7a59;
    /* stage tones */
    --lead:#7aa7d9; --contacted:#9aa4e6; --demoed:#ff7a59; --quote_sent:#45c0d6; --proposal:#ff8f73; --sold:#2fd5bf; --lost:#ff7b81;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; min-height:100vh; font-family:var(--mono); color:var(--z-100); line-height:1.5;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1200px 600px at 30% -10%, rgba(56,189,248,0.05), transparent 55%),
      radial-gradient(1000px 500px at 100% -5%, rgba(255,143,115,0.035), transparent 50%),
      var(--bg);
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:rgba(69,192,214,0.25);color:#fff;}
  body::before{content:"";position:fixed;inset:0;z-index:90;pointer-events:none;opacity:0.08;
    background-image:linear-gradient(to bottom,rgba(255,255,255,0.10) 1px,transparent 1px);background-size:100% 4px;}

  .wrap{max-width:1360px;margin:0 auto;padding:clamp(16px,3vw,32px);}

  /* ---- top bar ---- */
  .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px dashed rgba(63,63,70,0.9);}
  .back{display:inline-flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:0.22em;color:var(--z-400);
    border:1px solid var(--z-800);border-radius:999px;padding:8px 14px;transition:border-color .15s,color .15s;}
  .back:hover{border-color:var(--z-500);color:var(--z-50);}
  .titles{display:flex;flex-direction:column;gap:3px;}
  .titles .eyebrow{font-size:10px;text-transform:uppercase;letter-spacing:0.3em;color:var(--z-500);}
  .titles h1{font-family:var(--display);font-size:1.5rem;font-weight:600;margin:0;color:var(--z-50);letter-spacing:0.01em;}
  .bar .sp{flex:1;}
  .badge{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:7px 13px;font-size:10px;text-transform:uppercase;letter-spacing:0.24em;
    border:1px solid rgba(47,213,191,0.35);background:rgba(47,213,191,0.10);color:#b8ece4;}
  .badge .pulse{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite;}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,213,191,0.5);}70%{box-shadow:0 0 0 6px rgba(47,213,191,0);}100%{box-shadow:0 0 0 0 rgba(47,213,191,0);}}
  .logout{font-size:11px;text-transform:uppercase;letter-spacing:0.22em;color:var(--red);border:1px solid transparent;border-radius:999px;padding:8px 14px;transition:background .15s;}
  .logout:hover{background:rgba(255,123,129,0.08);}

  /* ---- stat strip ---- */
  .strip{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px;}
  .panel{position:relative;overflow:hidden;border-radius:16px;border:1px solid var(--z-800);
    background:linear-gradient(180deg,var(--panel-a),var(--panel-b)),#000;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.03),0 18px 38px rgba(0,0,0,0.30);}
  .panel::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.16),transparent);opacity:.5;pointer-events:none;}
  .panel>*{position:relative;z-index:1;}
  .panel[data-tone="cyan"]{border-color:rgba(69,192,214,0.25);}
  .panel[data-tone="green"]{border-color:rgba(47,213,191,0.22);}
  .panel[data-tone="yellow"]{border-color:rgba(255,143,115,0.24);}
  .panel[data-tone="purple"]{border-color:rgba(154,164,230,0.24);}
  .stat{padding:15px 16px;display:flex;flex-direction:column;gap:3px;}
  .stat .k{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.26em;}
  .stat .v{font-family:var(--display);font-size:1.7rem;font-weight:600;color:var(--z-50);font-variant-numeric:tabular-nums;line-height:1.1;}
  .stat .s{font-size:11px;color:var(--z-500);}
  .stat.cyan .k{color:var(--cyan);} .stat.cyan .v{color:var(--cyan);}
  .stat.green .k{color:var(--green);} .stat.green .v{color:var(--green);}
  .stat.yellow .k{color:var(--yellow);} .stat.yellow .v{color:var(--yellow);}
  .stat.purple .k{color:var(--purple);} .stat.purple .v{color:var(--purple);}

  /* ---- filter bar ---- */
  .filters{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:22px 0 14px;}
  .search{position:relative;flex:1;min-width:220px;}
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--z-500);}
  .search input{width:100%;background:rgba(9,9,11,0.7);border:1px solid var(--z-800);border-radius:10px;color:var(--z-100);
    font-family:var(--mono);font-size:13px;padding:9px 12px 9px 34px;}
  .search input::placeholder{color:var(--z-600);}
  .search input:focus{outline:none;border-color:rgba(69,192,214,0.5);}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{font-size:10.5px;text-transform:uppercase;letter-spacing:0.14em;color:var(--z-400);background:rgba(9,9,11,0.6);
    border:1px solid var(--z-800);border-radius:999px;padding:6px 12px;cursor:pointer;transition:all .14s;font-family:var(--mono);}
  .chip:hover{border-color:var(--z-600);color:var(--z-200);}
  .chip.active{border-color:rgba(69,192,214,0.5);background:rgba(69,192,214,0.12);color:var(--cyan);}
  .chip .n{margin-left:6px;color:var(--z-500);font-variant-numeric:tabular-nums;}
  .chip.active .n{color:var(--cyan);}

  /* ---- table ---- */
  .table-panel{border-radius:16px;overflow:hidden;}
  .tscroll{overflow-x:auto;scrollbar-width:thin;scrollbar-color:rgba(113,113,122,0.6) transparent;}
  .tscroll::-webkit-scrollbar{height:9px;} .tscroll::-webkit-scrollbar-thumb{background:rgba(113,113,122,0.5);border-radius:999px;}
  table{width:100%;border-collapse:collapse;min-width:820px;}
  thead th{
    position:sticky;top:0;z-index:2;text-align:left;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.18em;
    color:var(--z-500);padding:13px 16px;background:#0a0a0b;border-bottom:1px solid var(--z-800);white-space:nowrap;user-select:none;
  }
  thead th.sortable{cursor:pointer;}
  thead th.sortable:hover{color:var(--z-300);}
  thead th .arr{opacity:0;margin-left:5px;font-size:9px;}
  thead th.sorted .arr{opacity:1;color:var(--cyan);}
  tbody tr{border-bottom:1px dashed rgba(63,63,70,0.55);transition:background .12s;cursor:pointer;}
  tbody tr:last-child{border-bottom:0;}
  tbody tr:hover{background:rgba(255,255,255,0.025);}
  tbody td{padding:12px 16px;font-size:13px;color:var(--z-200);vertical-align:middle;}
  td.name{font-weight:600;color:var(--z-50);}
  td.name .sub{display:block;font-size:11px;font-weight:400;color:var(--z-500);margin-top:1px;}
  td.phone{font-family:var(--mono);color:var(--z-100);white-space:nowrap;font-variant-numeric:tabular-nums;}
  td.dim{color:var(--z-400);}
  td.date{color:var(--z-500);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums;}
  .pkgtag{font-size:11px;color:var(--amber);}
  .fin{display:inline-block;margin-left:6px;font-size:9px;letter-spacing:0.1em;color:var(--green);border:1px solid rgba(47,213,191,0.3);border-radius:4px;padding:1px 5px;text-transform:uppercase;}
  .notedot{color:var(--amber);margin-left:6px;}

  /* Next action column: the step, then how late it is. Overdue has to be readable
     across the room — a cold lead is the most expensive thing in this table. */
  td.nextcell{max-width:230px;}
  .natext{display:block;font-size:12px;color:var(--z-100);line-height:1.35;}
  .naowner{display:block;font-size:10px;color:var(--z-500);margin-top:2px;}
  .due{display:inline-block;margin-top:3px;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;
       border:1px solid var(--z-800);border-radius:4px;padding:1px 5px;color:var(--z-500);}
  .due.today{color:var(--amber);border-color:rgba(251,191,36,0.4);}
  .due.soon{color:var(--amber);border-color:rgba(251,191,36,0.25);}
  .due.over{color:#fca5a5;border-color:rgba(248,113,113,0.5);background:rgba(248,113,113,0.08);}
  .due.none{color:#fca5a5;border-color:rgba(248,113,113,0.35);}

  .na-field input{width:100%;background:rgba(9,9,11,0.7);border:1px solid var(--z-800);color:var(--z-100);
    border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;}
  .na-field input:focus{outline:none;border-color:rgba(69,192,214,0.5);}
  .na-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
  button.save.ghost{background:none;border:1px solid var(--z-800);color:var(--z-500);}
  .na-hint{margin:8px 0 0;font-size:11px;line-height:1.5;color:var(--z-500);}

  /* stage select (inline) */
  .stage-sel{appearance:none;-webkit-appearance:none;font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:0.06em;
    border-radius:999px;padding:5px 26px 5px 12px;cursor:pointer;border:1px solid transparent;
    background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='3'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E");
    background-repeat:no-repeat;background-position:right 10px center;}
  .stage-sel:focus{outline:none;}
  .stage-sel option{background:#0a0a0b;color:var(--z-100);}
  .st-lead{color:var(--lead);border-color:rgba(122,167,217,0.35);background-color:rgba(122,167,217,0.10);}
  .st-contacted{color:var(--contacted);border-color:rgba(154,164,230,0.35);background-color:rgba(154,164,230,0.10);}
  .st-demoed{color:var(--demoed);border-color:rgba(245,158,11,0.35);background-color:rgba(245,158,11,0.10);}
  .st-quote_sent{color:var(--quote_sent);border-color:rgba(56,189,248,0.35);background-color:rgba(56,189,248,0.10);}
  .st-proposal{color:var(--proposal);border-color:rgba(255,143,115,0.35);background-color:rgba(255,143,115,0.10);}
  .st-sold{color:var(--sold);border-color:rgba(47,213,191,0.35);background-color:rgba(47,213,191,0.10);}
  .st-lost{color:var(--lost);border-color:rgba(255,123,129,0.35);background-color:rgba(255,123,129,0.10);}

  .empty{padding:48px 20px;text-align:center;color:var(--z-500);font-size:13px;}
  .empty svg{opacity:0.4;margin-bottom:10px;}
  .tfoot{padding:12px 16px;font-size:11px;color:var(--z-600);letter-spacing:0.06em;border-top:1px solid var(--z-800);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}

  .loading{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,2,2,0.7);z-index:70;color:var(--z-400);font-size:13px;letter-spacing:0.12em;text-transform:uppercase;}

  /* ---- detail drawer ---- */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,0.6);backdrop-filter:blur(2px);z-index:80;opacity:0;pointer-events:none;transition:opacity .18s;}
  .scrim.open{opacity:1;pointer-events:auto;}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(440px,100%);z-index:81;
    background:linear-gradient(180deg,#0a0a0b,#050505);border-left:1px solid var(--z-800);box-shadow:-16px 0 60px rgba(0,0,0,0.6);
    transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .dw-head{padding:22px 24px 18px;border-bottom:1px dashed rgba(63,63,70,0.9);}
  .dw-head .x{float:right;background:none;border:0;color:var(--z-500);font-size:24px;cursor:pointer;line-height:1;}
  .dw-head .x:hover{color:var(--z-50);}
  .dw-name{font-family:var(--display);font-size:1.5rem;font-weight:600;color:var(--z-50);margin:2px 0 6px;}
  .dw-stage{display:inline-flex;align-items:center;gap:7px;font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--z-400);}
  .dw-body{padding:20px 24px;overflow-y:auto;flex:1;}
  .actions{display:flex;gap:8px;margin-bottom:18px;}
  .actions a{flex:1;text-align:center;font-weight:600;font-size:13px;padding:11px;border-radius:10px;letter-spacing:0.04em;}
  .call-btn{background:rgba(47,213,191,0.12);border:1px solid rgba(47,213,191,0.4);color:#b8ece4;}
  .call-btn:hover{background:rgba(47,213,191,0.2);}
  .msg-btn{background:rgba(9,9,11,0.7);border:1px solid var(--z-800);color:var(--z-200);}
  .msg-btn:hover{border-color:var(--z-600);}
  .kv{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed rgba(63,63,70,0.5);font-size:13.5px;}
  .kv .k{color:var(--z-500);width:92px;flex:0 0 92px;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;padding-top:3px;}
  .kv .v{flex:1;color:var(--z-200);}
  .kv .v a{color:var(--cyan);}
  .field{margin:18px 0 6px;}
  .field label{display:block;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--z-500);margin-bottom:8px;}
  .field select,.field textarea{width:100%;background:rgba(9,9,11,0.7);border:1px solid var(--z-800);color:var(--z-100);
    font-family:var(--mono);font-size:13.5px;padding:11px 12px;border-radius:10px;}
  .field select:focus,.field textarea:focus{outline:none;border-color:rgba(69,192,214,0.5);}
  .field textarea{min-height:110px;resize:vertical;line-height:1.55;}
  .save{margin-top:9px;background:rgba(69,192,214,0.12);border:1px solid rgba(69,192,214,0.4);color:var(--cyan);
    font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:0.1em;padding:9px 16px;border-radius:8px;cursor:pointer;}
  .save:hover{background:rgba(69,192,214,0.2);}
  .saved{color:var(--green);font-size:12px;margin-left:10px;}
  .danger{margin-top:24px;border-top:1px dashed rgba(63,63,70,0.9);padding-top:16px;}
  .danger button{background:none;border:1px solid var(--z-800);color:var(--red);font-size:11px;text-transform:uppercase;letter-spacing:0.1em;
    padding:9px 14px;border-radius:8px;cursor:pointer;font-family:var(--mono);}
  .danger button:hover{border-color:var(--red);background:rgba(255,123,129,0.08);}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);z-index:95;
    background:#0a0a0b;border:1px solid var(--z-700);color:var(--z-100);padding:11px 20px;border-radius:999px;font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,0.5);transition:transform .2s;}
  .toast.show{transform:translateX(-50%) translateY(0);}

  @media (max-width:640px){
    .strip{grid-template-columns:1fr 1fr;}
    td.hide-sm,thead th.hide-sm{display:none;}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}html{scroll-behavior:auto;}}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px;}
</style>

</head>
<body class="ops-standalone ops-contacts">
  <div class="wrap">

    <!-- TOP BAR -->
    <div class="bar">
      <a class="back" href="/internal/">
        <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        Command Center
      </a>
      <div class="titles">
        <span class="eyebrow">MACC · CRM</span>
        <h1>Contacts</h1>
      </div>
      <div class="sp"></div>
      <span class="badge"><span class="pulse" aria-hidden="true"></span> LIVE FEED</span>
      <a class="logout" href="/api/founder-logout">Log out</a>
    </div>

    <!-- STAT STRIP -->
    <div class="strip">
      <div class="panel stat cyan" data-tone="cyan"><span class="k">Total Contacts</span><span class="v" id="s-total">—</span><span class="s">All time</span></div>
      <div class="panel stat yellow" data-tone="yellow"><span class="k">Open</span><span class="v" id="s-open">—</span><span class="s">Not sold / lost</span></div>
      <div class="panel stat green" data-tone="green"><span class="k">Sold</span><span class="v" id="s-sold">—</span><span class="s" id="s-sold-val">Won value</span></div>
      <div class="panel stat purple" data-tone="purple"><span class="k">Pipeline Value</span><span class="v" id="s-pipe">—</span><span class="s">Open × ₱99.5k</span></div>
    </div>

    <!-- FILTERS -->
    <div class="filters">
      <div class="search">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search" type="search" placeholder="Search name, phone, email…" aria-label="Search contacts">
      </div>
      <div class="chips" id="chips"></div>
    </div>

    <!-- TABLE -->
    <div class="panel table-panel">
      <div class="tscroll">
        <table>
          <thead>
            <tr>
              <th class="sortable" data-sort="name" tabindex="0" role="button">Name<span class="arr" aria-hidden="true">▼</span></th>
              <th class="sortable" data-sort="phone" tabindex="0" role="button">Phone<span class="arr" aria-hidden="true">▼</span></th>
              <th class="sortable hide-sm" data-sort="goal" tabindex="0" role="button">Goal<span class="arr" aria-hidden="true">▼</span></th>
              <th class="sortable hide-sm" data-sort="package" tabindex="0" role="button">Package<span class="arr" aria-hidden="true">▼</span></th>
              <th class="sortable" data-sort="stage" tabindex="0" role="button">Stage<span class="arr" aria-hidden="true">▼</span></th>
              <th class="sortable" data-sort="next_action_due" tabindex="0" role="button">Next action<span class="arr" aria-hidden="true">▼</span></th>
              <th class="sortable hide-sm" data-sort="source" tabindex="0" role="button">Source<span class="arr" aria-hidden="true">▼</span></th>
              <th class="sortable" data-sort="created_at" tabindex="0" role="button">Received<span class="arr" aria-hidden="true">▼</span></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <!-- Suggestions, not a fixed list — every one of these is a commitment ask or a
           step that produces one, so the easy path is also the compliant one (§2). -->
      <datalist id="na-presets">
        <option value="Book the site survey — ask for a named date"></option>
        <option value="Send the quote"></option>
        <option value="Follow up on the quote — ask for a decision date"></option>
        <option value="Ask for the reservation deposit"></option>
        <option value="Ask to see last month's BILECO bill"></option>
        <option value="Ask for an intro to a neighbour"></option>
        <option value="Confirm the install date"></option>
        <option value="Mark as lost — they dodged the commitment ask"></option>
      </datalist>
      <div class="tfoot"><span id="foot-count">—</span><span>Click a row for detail · change stage inline</span></div>
    </div>
  </div>

  <!-- detail drawer -->
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>

  <div class="loading" id="loading">Loading contacts…</div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (function(){
    "use strict";
    var STAGES=[
      {id:"lead",label:"New Lead"},
      {id:"contacted",label:"Contacted"},
      {id:"demoed",label:"Demoed"},
      {id:"quote_sent",label:"Quote Sent"},
      {id:"proposal",label:"Proposal"},
      {id:"sold",label:"Sold"},
      {id:"lost",label:"Lost"}
    ];
    var stageLabel={}; STAGES.forEach(function(s){stageLabel[s.id]=s.label;});
    var PKG_PRICE=99500;

    var leads=[], filter="", stageFilter="all";
    var sortKey="created_at", sortDir=-1; // -1 desc, 1 asc
    var el=function(id){return document.getElementById(id);};

    function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
    function digits(p){return (p||"").replace(/[^\d+]/g,"");}
    function telHref(p){var d=digits(p);if(d.indexOf("0")===0)d="+63"+d.slice(1);return "tel:"+d;}
    function fmtDate(iso){if(!iso)return "";var d=new Date(iso);if(isNaN(d))return "";return d.toLocaleDateString(undefined,{year:"numeric",month:"short",day:"numeric"});}
    function peso(n){return "₱"+Math.round(n).toLocaleString();}
    function pesoShort(n){if(n>=1e6)return "₱"+(n/1e6).toFixed(1)+"M";if(n>=1e3)return "₱"+Math.round(n/1e3)+"k";return "₱"+n;}
    function goalShort(g){if(!g)return "";if(/on-grid|lower/i.test(g))return "Lower bill";if(/off-grid|backup/i.test(g))return "Backup";if(/both|hybrid/i.test(g))return "Hybrid";return g;}
    function isFin(l){return l.financing==1||l.financing===true;}

    var toastT;
    function toast(msg){var t=el("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},2200);}

    function load(){
      fetch("/api/leads",{headers:{"Accept":"application/json"}})
        .then(function(r){
          if(r.status===401){window.location.href="/login.html?next=/internal/leads.html";return null;}
          return r.json();
        })
        .then(function(d){
          if(!d)return;
          leads=(d.leads||[]);
          el("loading").style.display="none";
          renderChips(); renderStats(); renderRows();
        })
        .catch(function(){el("loading").textContent="Couldn't load contacts. Refresh to retry.";});
    }

    function matchesSearch(l){
      if(!filter)return true;
      var hay=((l.name||"")+" "+(l.phone||"")+" "+(l.email||"")).toLowerCase();
      return hay.indexOf(filter)>-1;
    }
    function matchesStage(l){return stageFilter==="all"?true:l.stage===stageFilter;}
    function visible(){return leads.filter(function(l){return matchesSearch(l)&&matchesStage(l);});}

    function renderStats(){
      var total=leads.length;
      var open=leads.filter(function(l){return l.stage!=="sold"&&l.stage!=="lost";}).length;
      var sold=leads.filter(function(l){return l.stage==="sold";}).length;
      el("s-total").textContent=total;
      el("s-open").textContent=open;
      el("s-sold").textContent=sold;
      el("s-sold-val").textContent=sold?peso(sold*PKG_PRICE)+" won":"Won value";
      el("s-pipe").textContent=pesoShort(open*PKG_PRICE);
    }

    function renderChips(){
      var counts={all:leads.length};
      STAGES.forEach(function(s){counts[s.id]=leads.filter(function(l){return l.stage===s.id;}).length;});
      var html='<button type="button" class="chip'+(stageFilter==="all"?" active":"")+'" aria-pressed="'+(stageFilter==="all")+'" data-stage="all">All<span class="n">'+counts.all+'</span></button>';
      STAGES.forEach(function(s){
        html+='<button type="button" class="chip'+(stageFilter===s.id?" active":"")+'" aria-pressed="'+(stageFilter===s.id)+'" data-stage="'+s.id+'">'+s.label+'<span class="n">'+counts[s.id]+'</span></button>';
      });
      var c=el("chips"); c.innerHTML=html;
      Array.prototype.forEach.call(c.querySelectorAll(".chip"),function(btn){
        btn.addEventListener("click",function(){stageFilter=btn.dataset.stage;renderChips();renderRows();});
      });
    }

    function sortRows(rows){
      var k=sortKey;
      return rows.slice().sort(function(a,b){
        var av,bv;
        if(k==="created_at"){av=new Date(a.created_at||0).getTime();bv=new Date(b.created_at||0).getTime();}
        else if(k==="stage"){av=STAGES.findIndex(function(s){return s.id===a.stage;});bv=STAGES.findIndex(function(s){return s.id===b.stage;});}
        else if(k==="next_action_due"){av=nextActionSortValue(a);bv=nextActionSortValue(b);}
        else{av=(a[k]||"").toString().toLowerCase();bv=(b[k]||"").toString().toLowerCase();}
        if(av<bv)return -1*sortDir; if(av>bv)return 1*sortDir; return 0;
      });
    }

    function renderRows(){
      var rows=sortRows(visible());
      var tb=el("rows"); tb.innerHTML="";
      // header sort indicators
      Array.prototype.forEach.call(document.querySelectorAll("thead th.sortable"),function(th){
        var on=th.dataset.sort===sortKey;
        th.classList.toggle("sorted",on);
        th.setAttribute("aria-sort",on?(sortDir===1?"ascending":"descending"):"none");
        var arr=th.querySelector(".arr"); if(arr)arr.textContent=sortDir===1?"▲":"▼";
      });

      if(rows.length===0){
        tb.innerHTML='<tr><td colspan="8"><div class="empty">'+
          '<svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>'+
          '<div>'+(leads.length?"No contacts match this filter.":"No contacts yet. Leads from the funnel land here.")+'</div></div></td></tr>';
        el("foot-count").textContent="0 shown";
        return;
      }

      rows.forEach(function(l){
        var tr=document.createElement("tr");
        tr.dataset.id=l.id;
        tr.tabIndex=0;
        var note=(l.notes&&l.notes.trim())?'<span class="notedot" title="Has notes">✎</span>':'';
        var fin=isFin(l)?'<span class="fin">Financing</span>':'';
        var src=l.utm_source||l.source||"—";
        tr.innerHTML=
          '<td class="name">'+esc(l.name||"—")+note+
            (l.email?'<span class="sub">'+esc(l.email)+'</span>':'')+'</td>'+
          '<td class="phone">'+esc(l.phone||"—")+'</td>'+
          '<td class="dim hide-sm">'+esc(goalShort(l.goal)||"—")+'</td>'+
          '<td class="hide-sm">'+(l.package?'<span class="pkgtag">'+esc(l.package)+'</span>':'<span class="dim">—</span>')+fin+'</td>'+
          '<td>'+stageSelect(l)+'</td>'+
          '<td class="nextcell">'+nextActionCell(l)+'</td>'+
          '<td class="dim hide-sm">'+esc(src)+'</td>'+
          '<td class="date">'+fmtDate(l.created_at)+'</td>';
        // open drawer on row click, but ignore clicks on the stage select
        tr.addEventListener("click",function(e){
          if(e.target.closest(".stage-sel"))return;
          openDrawer(l.id);
        });
        tr.addEventListener("keydown",function(e){
          if(e.key==="Enter"){e.preventDefault();openDrawer(l.id);}
        });
        tb.appendChild(tr);
      });

      // wire inline stage selects
      Array.prototype.forEach.call(tb.querySelectorAll(".stage-sel"),function(sel){
        sel.addEventListener("change",function(e){
          e.stopPropagation();
          moveLead(parseInt(sel.dataset.id,10),sel.value);
        });
        sel.addEventListener("click",function(e){e.stopPropagation();});
      });

      el("foot-count").textContent=rows.length+" of "+leads.length+" shown";
    }

    /* ── next action ──────────────────────────────────────────────────────────
       One step per lead, with a due date, so "keep me posted" cannot masquerade as
       pipeline. A lead in a selling stage with no next action is called out as
       adrift rather than sitting quietly in the list. */

    var SELLING_STAGES=["lead","contacted","demoed","quote_sent","proposal"];
    function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
    /** Whole days from today; negative = overdue. Compared as dates, not timestamps. */
    function daysUntil(ymd){
      if(!ymd)return null;
      var a=new Date(ymd+"T00:00:00"),b=new Date(today()+"T00:00:00");
      if(isNaN(a))return null;
      return Math.round((a-b)/86400000);
    }
    function dueBadge(l){
      var d=daysUntil(l.next_action_due);
      if(d===null)return "";
      if(d<0)return '<span class="due over">'+Math.abs(d)+'d overdue</span>';
      if(d===0)return '<span class="due today">today</span>';
      if(d<=2)return '<span class="due soon">in '+d+'d</span>';
      return '<span class="due">'+fmtDate(l.next_action_due)+'</span>';
    }
    function nextActionCell(l){
      if(l.next_action&&String(l.next_action).trim()){
        return '<span class="natext">'+esc(l.next_action)+'</span>'+dueBadge(l)+
          (l.next_action_owner?'<span class="naowner">'+esc(l.next_action_owner)+'</span>':'');
      }
      if(SELLING_STAGES.indexOf(l.stage)!==-1)return '<span class="due none">no next step</span>';
      return '<span class="dim">—</span>';
    }
    /** Sort value: overdue first, then soonest, then leads with nothing set. */
    function nextActionSortValue(l){
      var d=daysUntil(l.next_action_due);
      if(d!==null)return d;
      if(l.next_action)return 9000;   // has an action but no date
      return 9999;                    // nothing set at all — last
    }

    function saveNextAction(id,action,due,owner){
      var l=leads.filter(function(x){return x.id==id;})[0];
      fetch("/api/leads",{method:"PATCH",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({id:id,next_action:action,next_action_due:due,next_action_owner:owner})})
        .then(function(r){return r.json();})
        .then(function(d){
          if(!d.ok){toast(d.error||"Save failed");return;}
          // Mirror what the server actually stored, so a rejected date can't linger in the UI.
          if(l){l.next_action=d.next_action;l.next_action_due=d.next_action_due;l.next_action_owner=d.next_action_owner;}
          var s=el("dwnasaved");if(s){s.textContent="Saved ✓";setTimeout(function(){if(s)s.textContent="";},1800);}
          renderRows();
        })
        .catch(function(){toast("Network error");});
    }

    function stageSelect(l){
      var opts=STAGES.map(function(s){return '<option value="'+s.id+'"'+(s.id===l.stage?" selected":"")+'>'+s.label+'</option>';}).join("");
      return '<select class="stage-sel st-'+l.stage+'" data-id="'+l.id+'" aria-label="Stage">'+opts+'</select>';
    }

    function moveLead(id,stage){
      var l=leads.filter(function(x){return x.id==id;})[0];
      if(!l||l.stage===stage)return;
      var prev=l.stage; l.stage=stage;
      renderChips(); renderStats(); renderRows(); // optimistic
      fetch("/api/leads",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id,stage:stage})})
        .then(function(r){return r.json();})
        .then(function(d){if(!d.ok){l.stage=prev;renderChips();renderStats();renderRows();toast("Couldn't move: "+(d.error||"error"));}else{toast(esc(l.name||"Contact")+" → "+stageLabel[stage]);}})
        .catch(function(){l.stage=prev;renderChips();renderStats();renderRows();toast("Network error — not saved");});
    }

    // ---- drawer ----
    var openId=null,drawerReturnFocus=null;
    function openDrawer(id){
      var l=leads.filter(function(x){return x.id==id;})[0]; if(!l)return;
      if(!openId)drawerReturnFocus=document.activeElement;
      openId=id;
      var dw=el("drawer");
      var options=STAGES.map(function(s){return '<option value="'+s.id+'"'+(s.id===l.stage?" selected":"")+'>'+s.label+'</option>';}).join("");
      dw.innerHTML=
        '<div class="dw-head"><button class="x" id="dwx" aria-label="Close">×</button>'+
          '<div class="dw-name">'+esc(l.name||"—")+'</div>'+
          '<span class="dw-stage st-'+l.stage+'" style="border:0;background:none;padding:0">● '+stageLabel[l.stage]+'</span>'+
        '</div>'+
        '<div class="dw-body">'+
          '<div class="actions">'+
            '<a class="call-btn" href="'+telHref(l.phone)+'">📞 Call</a>'+
            '<a class="msg-btn" href="sms:'+digits(l.phone)+'">💬 Text</a>'+
          '</div>'+
          kv("Phone",'<a href="'+telHref(l.phone)+'">'+esc(l.phone||"—")+'</a>')+
          (l.email?kv("Email",'<a href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a>'):"")+
          (l.goal?kv("Goal",esc(l.goal)):"")+
          (l.address?kv("Address",'<a href="https://maps.google.com/?q='+encodeURIComponent(l.address)+'" target="_blank" rel="noopener">'+esc(l.address)+'</a>'):"")+
          (l.monthly_bill?kv("Bill",esc(l.monthly_bill)):"")+
          (l.package?kv("Package",esc(l.package)):"")+
          (l.current_solution?kv("Doing now",esc(l.current_solution)):"")+
          ((l.interview_opt_in==1||l.interview_opt_in===true)?kv("Interview","Open to a 15-min call"):"")+
          kv("Financing",isFin(l)?"Yes — wants installments":"No")+
          ((l.utm_source||l.source)?kv("Source",esc(l.utm_source||l.source)):"")+
          kv("Received",fmtDate(l.created_at))+
          '<div class="field"><label>Stage</label><select id="dwstage">'+options+'</select></div>'+
          '<div class="field na-field"><label>Next action — the one thing that moves this forward</label>'+
            '<input id="dwna" maxlength="200" list="na-presets" placeholder="Book the site survey" value="'+esc(l.next_action||"")+'">'+
            '<div class="na-row">'+
              '<input id="dwnadue" type="date" value="'+esc(l.next_action_due||"")+'" aria-label="Due date">'+
              '<input id="dwnaowner" maxlength="80" placeholder="Owner" value="'+esc(l.next_action_owner||"")+'" aria-label="Owner">'+
            '</div>'+
            '<button class="save" id="dwnasave">Save next action</button>'+
            '<button class="save ghost" id="dwnaclear">Clear</button>'+
            '<span class="saved" id="dwnasaved"></span>'+
            '<p class="na-hint">Every sales-mode contact ends with a commitment ask — a survey date, an intro, a '+
              'reservation deposit. If they dodge it, that is a zombie lead, not pipeline.</p>'+
          '</div>'+
          '<div class="field"><label>Notes</label>'+
            '<textarea id="dwnotes" placeholder="Call outcome, quoted price, exact quotes from the conversation…">'+esc(l.notes||"")+'</textarea>'+
            '<button class="save" id="dwsave">Save notes</button><span class="saved" id="dwsaved"></span>'+
          '</div>'+
          '<div class="danger"><button id="dwdel">Delete contact</button></div>'+
        '</div>';
      el("scrim").classList.add("open");
      dw.classList.add("open"); dw.setAttribute("aria-hidden","false");
      el("dwx").onclick=closeDrawer;
      el("dwx").focus();
      el("dwstage").onchange=function(){moveLead(id,this.value);openDrawer(id);};
      el("dwsave").onclick=function(){saveNotes(id,el("dwnotes").value);};
      el("dwnasave").onclick=function(){saveNextAction(id,el("dwna").value,el("dwnadue").value,el("dwnaowner").value);};
      el("dwnaclear").onclick=function(){
        el("dwna").value="";el("dwnadue").value="";el("dwnaowner").value="";
        saveNextAction(id,"","","");
      };
      el("dwdel").onclick=function(){if(confirm("Delete this contact permanently?"))delLead(id);};
    }
    function kv(k,v){return '<div class="kv"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';}
    function closeDrawer(){
      if(!openId)return;
      openId=null;el("scrim").classList.remove("open");var dw=el("drawer");dw.classList.remove("open");dw.setAttribute("aria-hidden","true");
      if(drawerReturnFocus&&document.contains(drawerReturnFocus))drawerReturnFocus.focus();
      drawerReturnFocus=null;
    }
    el("scrim").addEventListener("click",closeDrawer);
    document.addEventListener("keydown",function(e){if(e.key==="Escape")closeDrawer();});

    function saveNotes(id,notes){
      var l=leads.filter(function(x){return x.id==id;})[0]; if(l)l.notes=notes;
      fetch("/api/leads",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id,notes:notes})})
        .then(function(r){return r.json();})
        .then(function(d){if(d.ok){var s=el("dwsaved");if(s){s.textContent="Saved ✓";setTimeout(function(){if(s)s.textContent="";},1800);}renderRows();}else{toast("Save failed");}})
        .catch(function(){toast("Network error");});
    }
    function delLead(id){
      fetch("/api/leads",{method:"DELETE",headers:{"Content-Type":"application/json"},body:JSON.stringify({id:id})})
        .then(function(r){return r.json();})
        .then(function(d){if(d.ok){leads=leads.filter(function(x){return x.id!=id;});closeDrawer();renderChips();renderStats();renderRows();toast("Contact deleted");}else{toast("Delete failed");}})
        .catch(function(){toast("Network error");});
    }

    // ---- sort headers ----
    Array.prototype.forEach.call(document.querySelectorAll("thead th.sortable"),function(th){
      function sort(){
        var k=th.dataset.sort;
        if(sortKey===k){sortDir=-sortDir;}
        else{sortKey=k;sortDir=(k==="created_at")?-1:1;}
        renderRows();
      }
      th.addEventListener("click",sort);
      th.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();sort();}});
    });

    el("search").addEventListener("input",function(){filter=this.value.trim().toLowerCase();renderRows();});

    load();
  })();
  </script>
</body>
</html>
