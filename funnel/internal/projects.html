<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobs &amp; Project Board — MACC Systems &amp; Engineering Inc.</title>
<script>
  // The Command Center shell is the UI for this page. A standalone load — refresh,
  // bookmark, pasted link — hits this real file with no shell around it, so bounce to
  // the dashboard, which reopens the page inside the SPA via ?open= (spa-router.js).
  // The slug comes from the path, so this block is identical on every page. Inside the
  // shell it re-runs after a swap, finds #cc-view, and does nothing.
  (function () {
    if (document.getElementById("cc-view")) return;
    var m = /^\/internal\/([a-z0-9-]+)(?:\.html)?$/i.exec(location.pathname);
    if (m && m[1].toLowerCase() !== "index") location.replace("/internal/?open=" + m[1].toLowerCase());
  })();
</script>
<script src="/internal/assets/theme.js"></script>
<link rel="icon" href="/assets/img/macc-mark.png">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/internal/assets/operations-redesign.css">
<link rel="stylesheet" href="/internal/assets/jobs.css">
</head>
<!--
  This page deliberately has NO <main> element, and the drawer / scrim / toast nodes sit
  as siblings of .wrap rather than inside it. That is what the SPA router expects here:
  for a page with no <main> it moves every child of <body> into a synthetic one, so the
  fixed-position drawer comes along with the content. Wrapping this in a <main> would
  drop those siblings on every SPA navigation. See spa-router.js swap().
-->
<body class="ops-standalone ops-projects">

  <div class="wrap jb-wrap">

    <!-- Live counts across every job. -->
    <div class="jb-kpis" id="jb-kpis"></div>

    <div class="jb-toolbar" id="jb-views-host" hidden>
      <div class="jb-views" role="tablist" aria-label="Jobs views">
        <button type="button" role="tab" data-view="board" aria-selected="true">Board <span class="jb-count">0</span></button>
        <button type="button" role="tab" data-view="list" aria-selected="false">List</button>
        <button type="button" role="tab" data-view="schedule" aria-selected="false">Schedule</button>
        <button type="button" role="tab" data-view="crew" aria-selected="false">Crew</button>
      </div>
      <input class="jb-search" id="jb-search" type="search" placeholder="Search customer, job code, barangay…" aria-label="Search jobs">
      <button type="button" class="jb-btn primary" data-act="new-job">New job from contact</button>
    </div>

    <!-- Every view renders into here. -->
    <div id="jb-app" aria-live="polite"></div>

  </div>

  <div class="jb-scrim" id="jb-scrim"></div>

  <aside class="jb-drawer" id="jb-drawer" role="dialog" aria-modal="true" aria-labelledby="jb-dname" tabindex="-1">
    <div class="jb-dhead">
      <div class="jb-dhead-top">
        <div>
          <span class="jb-code" id="jb-dcode">JOB —</span>
          <h2 id="jb-dname">—</h2>
          <div class="sub" id="jb-dsub"></div>
        </div>
        <button type="button" class="jb-close" id="jb-dclose" aria-label="Close job">✕</button>
      </div>
      <div class="jb-dmeta" id="jb-dmeta"></div>
      <div class="jb-rail" id="jb-drail" aria-label="Stage"></div>
      <div class="jb-dtabs" id="jb-dtabs" role="tablist" aria-label="Job detail">
        <button type="button" role="tab" data-tab="overview" aria-selected="true">Overview</button>
        <button type="button" role="tab" data-tab="tasks" aria-selected="false">Tasks</button>
        <button type="button" role="tab" data-tab="crew" aria-selected="false">Crew &amp; schedule</button>
        <button type="button" role="tab" data-tab="money" aria-selected="false">Money</button>
        <button type="button" role="tab" data-tab="files" aria-selected="false">Files</button>
        <button type="button" role="tab" data-tab="history" aria-selected="false">History</button>
      </div>
    </div>
    <div class="jb-dbody" id="jb-dbody"></div>
  </aside>

  <!-- New job. Its own drawer rather than an inline panel: the form is the same kind of
       focused, one-thing-at-a-time surface as the job detail, and pushing the board down
       to make room hid the very jobs you create against. Same scrim, same Escape. -->
  <aside class="jb-drawer narrow" id="jb-new" role="dialog" aria-modal="true" aria-labelledby="jb-ntitle" tabindex="-1">
    <div class="jb-dhead">
      <div class="jb-dhead-top">
        <div>
          <span class="jb-code">NEW JOB</span>
          <h2 id="jb-ntitle">Create a job</h2>
          <div class="sub">One installation, from survey through warranty.</div>
        </div>
        <button type="button" class="jb-close" id="jb-nclose" aria-label="Close new job">✕</button>
      </div>
    </div>
    <div class="jb-dbody" id="jb-nbody"></div>
  </aside>

  <div class="jb-toasts" id="jb-toasts" aria-live="polite"></div>

  <script src="/internal/assets/jobs.js"></script>
</body>
</html>
